<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DBMS Project{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6f8;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: #1f2933;
        }
        .card {
            width: 100%;
            max-width: 420px;
            margin: 24px;
            padding: 32px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }
        h1 { font-size: 1.5rem; margin: 0 0 6px; }
        .subtitle { margin: 0 0 24px; color: #616e7c; font-size: 0.95rem; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; }
        input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 16px;
            border: 1px solid #cbd2d9;
            border-radius: 8px;
            font-size: 1rem;
        }
        input:focus { outline: 2px solid #2f80ed; outline-offset: 1px; border-color: transparent; }
        button, .button {
            display: inline-block;
            width: 100%;
            padding: 11px 16px;
            border: none;
            border-radius: 8px;
            background: #2f80ed;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }
        button:hover, .button:hover { background: #1c6dd0; }
        .button.secondary {
            margin-top: 12px;
            background: #ffffff;
            color: #2f80ed;
            border: 1px solid #2f80ed;
        }
        .button.secondary:hover { background: #eaf2fd; }
        .messages { list-style: none; padding: 0; margin: 0 0 20px; }
        .messages li {
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .messages .error { background: #fde8e8; color: #9b1c1c; }
        .messages .success { background: #e3f9e5; color: #1f7a33; }
        ul.errors {
            margin: 0 0 16px;
            padding: 12px 12px 12px 32px;
            background: #fde8e8;
            color: #9b1c1c;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        .muted { color: #616e7c; font-size: 0.85rem; margin-top: 18px; text-align: center; }
        .muted a { color: #2f80ed; text-decoration: none; }
        .role-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            background: #eaf2fd;
            color: #1c6dd0;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .logout-form { margin-top: 24px; }
    </style>
</head>
<body>
    <main class="card">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <ul class="messages">
                    {% for category, message in messages %}
                        <li class="{{ 'error' if category == 'error' else 'success' }}">{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
